# Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: swaralipi-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SWARALIPI_DB_PATH
        value: /opt/render/project/src/backend/swaralipi.db
